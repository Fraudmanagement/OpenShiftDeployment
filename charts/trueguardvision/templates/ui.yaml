# Taban: yamls/30-ui.yaml — FraudBuster Admin UI (Next.js)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraudbuster-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app: fraudbuster-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraudbuster-ui
  template:
    metadata:
      labels:
        app: fraudbuster-ui
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret.name }}
      containers:
        - name: ui
          image: {{ .Values.ui.image }}
          imagePullPolicy: {{ .Values.ui.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: {{ .Values.ui.nodeEnv | quote }}
            - name: NEXT_TELEMETRY_DISABLED
              value: {{ .Values.ui.nextTelemetryDisabled | quote }}
            - name: DEMO_MODE
              value: {{ .Values.ui.demoMode | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: fraudbuster-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRES_IN
              value: {{ .Values.ui.jwtExpiresIn | quote }}
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: fraudbuster-secrets
                  key: FRAUDBUSTER_MONGODB_URI
            - name: MONGOOSE_AUTO_INDEX
              value: {{ .Values.ui.mongooseAutoIndex | quote }}
            - name: CLICKHOUSE_HOST
              valueFrom:
                configMapKeyRef:
                  name: external-db
                  key: FRAUDBUSTER_CLICKHOUSE_URL
            - name: CLICKHOUSE_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: external-db
                  key: CLICKHOUSE_DATABASE
            - name: CLICKHOUSE_USER
              valueFrom:
                configMapKeyRef:
                  name: external-db
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraudbuster-secrets
                  key: CLICKHOUSE_PASSWORD
            # Tuning map (values: ui.tuning) — yapısal env'ler burada tanımlanamaz
            {{- $reserved := list "NODE_ENV" "NEXT_TELEMETRY_DISABLED" "DEMO_MODE" "JWT_SECRET" "JWT_EXPIRES_IN" "MONGODB_URI" "MONGOOSE_AUTO_INDEX" "CLICKHOUSE_HOST" "CLICKHOUSE_DATABASE" "CLICKHOUSE_USER" "CLICKHOUSE_PASSWORD" "BACKEND_URL" "ADMIN_EMAIL" "ADMIN_PASSWORD" "ENABLE_POC_RESET" }}
            {{- range $k, $v := .Values.ui.tuning }}
            {{- if has $k $reserved }}
            {{- fail (printf "ui.tuning icinde yapisal env tanimlanamaz: %s" $k) }}
            {{- end }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: BACKEND_URL
              value: {{ .Values.ui.backendUrl | quote }}
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: fraudbuster-secrets
                  key: ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraudbuster-secrets
                  key: ADMIN_PASSWORD
            # POC reset araçları — gerçek production'da false
            - name: ENABLE_POC_RESET
              value: {{ .Values.ui.enablePocReset | quote }}
          resources:
{{ toYaml .Values.ui.resources | indent 12 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: fraudbuster-ui
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: fraudbuster-ui
  ports:
    - port: 3000
      targetPort: 3000
      name: http
