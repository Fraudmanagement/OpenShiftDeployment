# Taban: yamls/10-dragonfly.yaml
# Compose'daki cap_add/seccomp/sysctl ayarları restricted-v2 SCC uyumu için yok.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dragonfly
  namespace: {{ .Release.Namespace }}
  labels:
    app: dragonfly
spec:
  serviceName: dragonfly
  replicas: 1
  selector:
    matchLabels:
      app: dragonfly
  template:
    metadata:
      labels:
        app: dragonfly
        tgv-spread: "true"
    spec:
      {{- if include "trueguardvision.spreadAll" . }}
      {{- include "trueguardvision.spreadAffinity" . | nindent 6 }}
      {{- end }}
      {{- with .Values.dragonfly.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dragonfly.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dragonfly
          image: {{ .Values.dragonfly.image }}
          imagePullPolicy: {{ .Values.dragonfly.pullPolicy }}
          args:
            - "--logtostderr"
            - "--alsologtostderr"
            - "--proactor_threads={{ .Values.dragonfly.proactorThreads }}"
            - "--maxmemory={{ .Values.dragonfly.maxmemory }}"
            - "--dir=/data"
            - "--dbfilename=dump"
            - "--hz=50"
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
{{ toYaml .Values.dragonfly.resources | indent 12 }}
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 20
            periodSeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.dragonfly.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: dragonfly
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: dragonfly
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
