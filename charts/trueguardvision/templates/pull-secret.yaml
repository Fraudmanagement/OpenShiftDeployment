# yamls tabanında elle oluşturulan ghcr-pull secret'ının karşılığı.
# imagePullSecret.create=false ise secret'ı önceden kendiniz oluşturun.
{{- if .Values.imagePullSecret.create }}
{{- if not .Values.imagePullSecret.token }}
{{- fail "imagePullSecret.token bos — kurulumda --set imagePullSecret.token=ghp_XXX verin (ya da imagePullSecret.create=false)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imagePullSecret.name }}
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"{{ .Values.imagePullSecret.registry }}":{"username":"{{ .Values.imagePullSecret.username }}","password":"{{ .Values.imagePullSecret.token }}","auth":"{{ printf "%s:%s" .Values.imagePullSecret.username .Values.imagePullSecret.token | b64enc }}"}}}
{{- end }}
