# Taban: yamls/01-secrets.yaml
# JWT_SECRET, BE ve UI arasında AYNI olmak zorunda.
apiVersion: v1
kind: Secret
metadata:
  name: fraudbuster-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.auth.jwtSecret | quote }}
  CLICKHOUSE_PASSWORD: {{ .Values.externalDatabases.clickhouse.password | quote }}
  ADMIN_EMAIL: {{ .Values.auth.adminEmail | quote }}
  ADMIN_PASSWORD: {{ .Values.auth.adminPassword | quote }}
