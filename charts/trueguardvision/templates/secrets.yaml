# Taban: yamls/01-secrets.yaml
# JWT_SECRET, BE ve UI arasında AYNI olmak zorunda.
{{- $e := .Values.engine }}
{{- $auth := "" }}
{{- if $e.dragonflyUser }}
{{- $auth = printf "%s:%s@" $e.dragonflyUser (urlquery $e.dragonflyPassword) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: fraudbuster-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  # Dragonfly ACL şifresi içerdiği için Secret'ta; şifre --set ile verilir.
  # Şifredeki + ve / karakterleri urlquery ile encode edilir.
  FRAUDBUSTER_REDIS_URI: {{ printf "redis://%s%s:%v?%s" $auth $e.dragonflyHost $e.dragonflyPort $e.dragonflyParams | quote }}
  JWT_SECRET: {{ .Values.auth.jwtSecret | quote }}
  CLICKHOUSE_PASSWORD: {{ .Values.externalDatabases.clickhouse.password | quote }}
  ADMIN_EMAIL: {{ .Values.auth.adminEmail | quote }}
  ADMIN_PASSWORD: {{ .Values.auth.adminPassword | quote }}
