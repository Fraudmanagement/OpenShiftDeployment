# Taban: yamls/02-external-db.yaml — cluster DIŞINDAKİ MongoDB ve ClickHouse adresleri
# NOT: Kimlik bilgisi içeren değerler (MongoDB URI, Dragonfly URI, ClickHouse
# şifresi) burada değil, fraudbuster-secrets Secret'ında tutulur.
apiVersion: v1
kind: ConfigMap
metadata:
  name: external-db
  namespace: {{ .Release.Namespace }}
data:
  MONGODB_DATABASE: {{ .Values.externalDatabases.mongodb.database | quote }}
  FRAUDBUSTER_CLICKHOUSE_URL: {{ .Values.externalDatabases.clickhouse.url | quote }}
  CLICKHOUSE_DATABASE: {{ .Values.externalDatabases.clickhouse.database | quote }}
  CLICKHOUSE_USER: {{ .Values.externalDatabases.clickhouse.user | quote }}
