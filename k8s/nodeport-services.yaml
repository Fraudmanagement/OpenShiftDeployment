# =============================================================================
# Vanilla Kubernetes dış erişim — Route'ların NodePort karşılığı (test-high)
# Chart'a DOKUNMAZ; mevcut ClusterIP service'lerin yanına ek service açar.
# Kullanım:  kubectl apply -n fraud-poc -f k8s/nodeport-services.yaml
# Erişim:    http://<HERHANGİ_NODE_PUBLIC_IP>:<nodePort>
#   fm ui        : 30300  (fraudbuster-ui:3000 — /api/poc dahil, UI proxy'ler)
#   sim ui       : 30301  (eventsimulator-ui:3000)
#   sim engine   : 30707  (eventsimulator-engine:7070)
# Security group: 30000-32767 yalnız kendi IP'nize açık olmalı.
# NOT: OpenShift Route'lardaki path-split (fm-backend /api/backend rewrite)
# burada yok; UI compose'daki gibi backend'e cluster içi adresten gider
# (ui.backendUrl=http://fraudbuster-be:5432), dışarıdan backend erişimi
# gerekirse ayrı NodePort ekleyin.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: fraudbuster-ui-nodeport
spec:
  type: NodePort
  selector:
    app: fraudbuster-ui
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
---
apiVersion: v1
kind: Service
metadata:
  name: eventsimulator-ui-nodeport
spec:
  type: NodePort
  selector:
    app: eventsimulator-ui
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30301
---
apiVersion: v1
kind: Service
metadata:
  name: eventsimulator-engine-nodeport
spec:
  type: NodePort
  selector:
    app: eventsimulator-engine
  ports:
    - name: http
      port: 7070
      targetPort: 7070
      nodePort: 30707
